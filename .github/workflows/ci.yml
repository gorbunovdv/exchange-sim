name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update apt
        run: apt update

      - name: Install just
        run: apt install just -y

      - name: Bootstrap requirements
        run: |
          DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC just bootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Detect conan profile
        run: conan profile detect

      - name: Run tests from scratch
        run: |
          just test-from-scratch address Debug
          just test-from-scratch none Release
          just test-from-scratch none Release "./conan/profiles/gcc.profile"
