name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --security-opt seccomp=unconfined --ulimit memlock=-1:-1

    steps:
      - name: Update apt
        run: apt update

      - name: Install just and git
        run: apt install just git nodejs -y

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bootstrap requirements
        run: |
          DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC just bootstrap

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Restore conan
        id: conan-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.*') }}

      - name: Run benchmarks
        run: |
          just generate-flow ./configs/github-ci.json 5
          just benchmark ./configs/github-ci.json --reps 1 --timeout 5 --skip-isolation-check

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save conan
        if: always() && steps.conan-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan-restore.outputs.cache-primary-key }}
