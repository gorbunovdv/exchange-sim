name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Update apt
        run: apt update

      - name: Install just and git
        run: apt install just git nodejs -y

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bootstrap requirements
        run: |
          DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC just bootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Cache conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.*') }}

      - name: Check clang-format
        run: |
          just format-check

      - name: Run tests from scratch
        run: |
          just test-from-scratch clang-debug-asan
          just test-from-scratch clang-debug
          just test-from-scratch gcc-debug-asan

      - name: Run linter
        run: |
          just lint-from-scratch