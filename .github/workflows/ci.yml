name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --security-opt seccomp=unconfined

    steps:
      - name: Update apt
        run: apt update

      - name: Install just and git
        run: apt install just git nodejs -y

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bootstrap requirements
        run: |
          DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC just bootstrap

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Cache conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.*') }}

      - name: Check format
        run: |
          just format-check

      - name: Run pylint
        run: |
          just pylint

      - name: Verify compilation
        run: |
          just verify-headers clang-release
          just build clang-release
          just verify-headers gcc-release
          just build gcc-release

      - name: Run linter
        run: |
          just lint clang-debug

      - name: Run tests from scratch
        run: |
          just test clang-debug-asan
          just test gcc-debug-asan
          just test clang-debug-tsan

      - name: Try running benchmark
        run: |
          just benchmark ./configs/github-ci.json \
            --apps single_threaded_callback_app single_threaded_event_loop_app \
            --timeout 10 \
            --hard-timeout 5 \
            --skip-isolation-check \
            --skip-cache-drop \
            --reps 3 \
            --label github-ci
          just evaluate ./configs/github-ci.json \
            --label github-ci \
            --apps single_threaded_callback_app single_threaded_event_loop_app
          